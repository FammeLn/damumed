<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1B2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2A4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F62FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3399FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008A52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C97A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B3FE4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A96FF5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0094A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C8DF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC2936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F45B69;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3399FF" opacity="0.9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00C97A" opacity="0.9"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A96FF5" opacity="0.9"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9A3C" opacity="0.9"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00C8DF" opacity="0.9"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F45B69" opacity="0.9"/>
    </marker>
  </defs>

  <!-- Main background -->
  <rect width="900" height="900" fill="url(#bgGrad)" rx="20"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="900" height="900" fill="url(#grid)" rx="20"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="1">Цикл взаимодействия голосового ассистента</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#78A9FF" opacity="0.85">Damumed · Voice Assistant Interaction Flow</text>

  <!-- Divider line -->
  <line x1="80" y1="82" x2="820" y2="82" stroke="#3399FF" stroke-width="1" opacity="0.3"/>

  <!-- ============================================================
       NODES — hexagonal-ish cards in circular layout
       Center: 450, 490   Radius: 270
       Angles: 270°(top), 270+60=330, 330+60=30, 30+60=90(bottom), 90+60=150, 150+60=210
       Node centers:
         1: top    450, 220
         2: TR     684, 355
         3: BR     684, 555  (actually let me do a clear 6-step circular)
         4: bottom 450, 690  (wait too much, let's make it 480 center, 240 radius)
       Let me use a cleaner layout:
       Center: 450, 490
       R = 250
       1 (top):    450,  240  -> angle 270
       2 (TR):     667,  365  -> angle 330
       3 (BR):     667,  615  -> angle  30
       4 (bot):    450,  740  -> angle  90
       5 (BL):     233,  615  -> angle 150
       6 (TL):     233,  365  -> angle 210
  ============================================================ -->

  <!-- Node positions (card center):
       1: 450, 220  (top)
       2: 675, 352  (top-right)
       3: 675, 598  (bottom-right)
       4: 450, 730  (bottom)
       5: 225, 598  (bottom-left)
       6: 225, 352  (top-left)
  -->

  <!-- ─── ARROWS ─── (drawn before nodes so nodes appear on top) -->

  <!-- 1 → 2: top to top-right -->
  <path d="M 530 245 Q 630 270 648 330" fill="none" stroke="#3399FF" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)" opacity="0.85"/>

  <!-- 2 → 3: top-right to bottom-right -->
  <path d="M 675 412 L 675 538" fill="none" stroke="#00C97A" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)" opacity="0.85"/>

  <!-- 3 → 4: bottom-right to bottom -->
  <path d="M 648 628 Q 630 690 530 713" fill="none" stroke="#A96FF5" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)" opacity="0.85"/>

  <!-- 4 → 5: bottom to bottom-left -->
  <path d="M 370 713 Q 270 690 252 628" fill="none" stroke="#FF9A3C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)" opacity="0.85"/>

  <!-- 5 → 6: bottom-left to top-left -->
  <path d="M 225 538 L 225 412" fill="none" stroke="#00C8DF" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowTeal)" opacity="0.85"/>

  <!-- 6 → 1: top-left to top -->
  <path d="M 252 330 Q 270 270 370 245" fill="none" stroke="#F45B69" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowRed)" opacity="0.85"/>

  <!-- Center circle (decorative) -->
  <circle cx="450" cy="480" r="68" fill="#0F1B2D" stroke="#3399FF" stroke-width="1.5" opacity="0.5"/>
  <circle cx="450" cy="480" r="55" fill="none" stroke="#3399FF" stroke-width="0.7" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Mic icon in center -->
  <rect x="441" y="452" width="18" height="28" rx="9" fill="none" stroke="#78A9FF" stroke-width="2.5"/>
  <path d="M 435 474 Q 435 496 450 496 Q 465 496 465 474" fill="none" stroke="#78A9FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="450" y1="496" x2="450" y2="506" stroke="#78A9FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="442" y1="506" x2="458" y2="506" stroke="#78A9FF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="450" y="524" text-anchor="middle" font-size="9" fill="#78A9FF" opacity="0.7" letter-spacing="0.5">DAMUMED</text>

  <!-- ─── NODE 1: top ─── -->
  <g filter="url(#shadow)">
    <rect x="340" y="140" width="220" height="115" rx="18" fill="url(#blueGrad)" opacity="0.95"/>
    <rect x="340" y="140" width="220" height="115" rx="18" fill="none" stroke="#78A9FF" stroke-width="1.2" opacity="0.6"/>
  </g>
  <!-- Step badge -->
  <circle cx="362" cy="162" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="362" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <!-- Icon: finger tap -->
  <circle cx="432" cy="173" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="432" y="179" text-anchor="middle" font-size="20">👆</text>
  <!-- Text -->
  <text x="460" y="162" font-size="13" font-weight="700" fill="#FFFFFF">Пользователь</text>
  <text x="350" y="198" font-size="11" fill="#CCDFFF">Нажимает кнопку микрофона</text>
  <text x="350" y="214" font-size="11" fill="#CCDFFF">в мобильном приложении</text>
  <text x="350" y="234" font-size="10" fill="#78A9FF" opacity="0.8">FloatingActionButton · HomeScreen</text>

  <!-- ─── NODE 2: top-right ─── -->
  <g filter="url(#shadow)">
    <rect x="565" y="272" width="220" height="115" rx="18" fill="url(#greenGrad)" opacity="0.95"/>
    <rect x="565" y="272" width="220" height="115" rx="18" fill="none" stroke="#00C97A" stroke-width="1.2" opacity="0.6"/>
  </g>
  <circle cx="587" cy="294" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="587" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="655" cy="305" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="655" y="311" text-anchor="middle" font-size="20">🎤</text>
  <text x="683" y="294" font-size="13" font-weight="700" fill="#FFFFFF">SpeechRecognizer</text>
  <text x="575" y="330" font-size="11" fill="#CCFFE8">Android API записывает голос</text>
  <text x="575" y="346" font-size="11" fill="#CCFFE8">и преобразует в текст</text>
  <text x="575" y="366" font-size="10" fill="#4CFFB4" opacity="0.8">android.speech.SpeechRecognizer</text>

  <!-- ─── NODE 3: bottom-right ─── -->
  <g filter="url(#shadow)">
    <rect x="565" y="518" width="220" height="115" rx="18" fill="url(#purpleGrad)" opacity="0.95"/>
    <rect x="565" y="518" width="220" height="115" rx="18" fill="none" stroke="#A96FF5" stroke-width="1.2" opacity="0.6"/>
  </g>
  <circle cx="587" cy="540" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="587" y="545" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="655" cy="551" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="655" y="557" text-anchor="middle" font-size="20">📡</text>
  <text x="683" y="540" font-size="13" font-weight="700" fill="#FFFFFF">HTTP запрос</text>
  <text x="575" y="576" font-size="11" fill="#E8D5FF">Приложение отправляет текст</text>
  <text x="575" y="592" font-size="11" fill="#E8D5FF">на бэкенд-сервер</text>
  <text x="575" y="612" font-size="10" fill="#C49FFF" opacity="0.8">POST /api/assistant/query</text>

  <!-- ─── NODE 4: bottom ─── -->
  <g filter="url(#shadow)">
    <rect x="340" y="648" width="220" height="115" rx="18" fill="url(#orangeGrad)" opacity="0.95"/>
    <rect x="340" y="648" width="220" height="115" rx="18" fill="none" stroke="#FF9A3C" stroke-width="1.2" opacity="0.6"/>
  </g>
  <circle cx="362" cy="670" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="362" y="675" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <circle cx="432" cy="681" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="432" y="687" text-anchor="middle" font-size="20">🤖</text>
  <text x="458" y="670" font-size="13" font-weight="700" fill="#FFFFFF">ML Классификатор</text>
  <text x="350" y="706" font-size="11" fill="#FFE8CC">Бэкенд вызывает Python ML</text>
  <text x="350" y="722" font-size="11" fill="#FFE8CC">сервис для классификации</text>
  <text x="350" y="742" font-size="10" fill="#FFBF7A" opacity="0.8">ML Service · Intent Classification</text>

  <!-- ─── NODE 5: bottom-left ─── -->
  <g filter="url(#shadow)">
    <rect x="115" y="518" width="220" height="115" rx="18" fill="url(#tealGrad)" opacity="0.95"/>
    <rect x="115" y="518" width="220" height="115" rx="18" fill="none" stroke="#00C8DF" stroke-width="1.2" opacity="0.6"/>
  </g>
  <circle cx="137" cy="540" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="137" y="545" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
  <circle cx="200" cy="551" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="200" y="557" text-anchor="middle" font-size="20">✅</text>
  <text x="228" y="540" font-size="13" font-weight="700" fill="#FFFFFF">Ответ системы</text>
  <text x="125" y="576" font-size="11" fill="#C8F6FF">Возвращает намерение</text>
  <text x="125" y="592" font-size="11" fill="#C8F6FF">и действие (action)</text>
  <text x="125" y="612" font-size="10" fill="#7EE8F5" opacity="0.8">intent + action JSON response</text>

  <!-- ─── NODE 6: top-left ─── -->
  <g filter="url(#shadow)">
    <rect x="115" y="272" width="220" height="115" rx="18" fill="url(#redGrad)" opacity="0.95"/>
    <rect x="115" y="272" width="220" height="115" rx="18" fill="none" stroke="#F45B69" stroke-width="1.2" opacity="0.6"/>
  </g>
  <circle cx="137" cy="294" r="14" fill="#FFFFFF" opacity="0.2"/>
  <text x="137" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">6</text>
  <circle cx="200" cy="305" r="20" fill="#FFFFFF" opacity="0.15"/>
  <text x="200" y="311" text-anchor="middle" font-size="20">🔊</text>
  <text x="228" y="294" font-size="13" font-weight="700" fill="#FFFFFF">Навигация + TTS</text>
  <text x="125" y="330" font-size="11" fill="#FFD5D8">Открывает нужный экран</text>
  <text x="125" y="346" font-size="11" fill="#FFD5D8">и озвучивает ответ</text>
  <text x="125" y="366" font-size="10" fill="#FFA0AA" opacity="0.8">NavController · TextToSpeech</text>

  <!-- ─── Arrow labels ─── -->
  <!-- 1→2 label -->
  <rect x="586" y="248" width="90" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="631" y="262" text-anchor="middle" font-size="10" fill="#78CFFF">голос пользователя</text>

  <!-- 2→3 label -->
  <rect x="682" y="464" width="80" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="722" y="478" text-anchor="middle" font-size="10" fill="#4CFFB4">распознанный текст</text>

  <!-- 3→4 label -->
  <rect x="556" y="668" width="82" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="597" y="682" text-anchor="middle" font-size="10" fill="#C49FFF">HTTP POST запрос</text>

  <!-- 4→5 label -->
  <rect x="260" y="668" width="80" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="300" y="682" text-anchor="middle" font-size="10" fill="#FF9A3C">ML предсказание</text>

  <!-- 5→6 label -->
  <rect x="136" y="464" width="76" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="174" y="478" text-anchor="middle" font-size="10" fill="#00C8DF">intent + action</text>

  <!-- 6→1 label -->
  <rect x="222" y="248" width="80" height="20" rx="6" fill="#0F1B2D" opacity="0.75"/>
  <text x="262" y="262" text-anchor="middle" font-size="10" fill="#F45B69">навигация + TTS</text>

  <!-- ─── Footer ─── -->
  <line x1="80" y1="858" x2="820" y2="858" stroke="#3399FF" stroke-width="1" opacity="0.2"/>
  <text x="450" y="878" text-anchor="middle" font-size="11" fill="#78A9FF" opacity="0.6">Damumed Health App · Voice Assistant Architecture · 2026</text>

</svg>
