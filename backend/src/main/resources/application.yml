spring:
  application:
    name: intelliheart-backend
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/intelliheart}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

server:
  port: 8080
  servlet:
    context-path: /

# Конфигурация ML микросервиса
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.damumed.intelliheart: DEBUG

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:intelliheart_auth_bot}
    auth-expiration-minutes: ${TELEGRAM_AUTH_EXPIRATION_MINUTES:10}
    session-ttl-hours: ${TELEGRAM_SESSION_TTL_HOURS:168}

auth:
  session-ttl-hours: ${AUTH_SESSION_TTL_HOURS:168}
