<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090E1A"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>

    <!-- Card Background Gradients (Glassmorphism dark overlays) -->
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#101A30"/>
      <stop offset="100%" style="stop-color:#080E1C"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2022"/>
      <stop offset="100%" style="stop-color:#081112"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16132C"/>
      <stop offset="100%" style="stop-color:#0B0918"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F112D"/>
      <stop offset="100%" style="stop-color:#100818"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#21140B"/>
      <stop offset="100%" style="stop-color:#120A05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="aBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#60A5FA"/>
    </marker>
    <marker id="aTeal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2DD4BF"/>
    </marker>
    <marker id="aPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#A78BFA"/>
    </marker>
    <marker id="aPink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#F0ABFC"/>
    </marker>
    <marker id="aAmber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- ════════ BACKGROUND ════════ -->
  <rect width="1100" height="980" fill="url(#bg)" rx="16"/>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.8" fill="#FFFFFF" opacity="0.06"/>
  </pattern>
  <rect width="1100" height="980" fill="url(#dots)" rx="16"/>

  <!-- ════════ TITLE ════════ -->
  <text x="550" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">Слои безопасности системы</text>
  <text x="550" y="68" text-anchor="middle" font-size="13" fill="#60A5FA">IntelliHeart · End-to-End System Security Layers</text>
  <line x1="60" y1="82" x2="1040" y2="82" stroke="#1E40AF" stroke-width="1" opacity="0.5"/>


  <!-- ════════════════════════════════════════════════════
       TOP NODE: CLIENT APP
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="440" y="100" width="220" height="46" rx="10" fill="#0E1726" stroke="#3B82F6" stroke-width="1.2"/>
  </g>
  <text x="550" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#93C5FD">📱 Android Client App</text>
  <text x="550" y="134" text-anchor="middle" font-size="9" fill="#64748B">Инициация запроса к бэкенду</text>

  <!-- Connection Line 1 -->
  <line x1="550" y1="146" x2="550" y2="182" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aBlue)"/>


  <!-- ════════════════════════════════════════════════════
       LAYER 1: TRANSPORT SECURITY (HTTPS)
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="150" y="190" width="800" height="85" rx="14" fill="url(#gBlue)" stroke="#3B82F6" stroke-width="1.2"/>
  </g>
  <!-- Card Header Glow -->
  <rect x="150" y="190" width="800" height="4" rx="2" fill="#3B82F6" opacity="0.6"/>
  <!-- Left Badge & Circle -->
  <circle cx="185" cy="232.5" r="18" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="185" y="236.5" text-anchor="middle" font-size="12" font-weight="700" fill="#60A5FA">01</text>
  <!-- Main Text -->
  <text x="225" y="218" font-size="13" font-weight="700" fill="#93C5FD">УРОВЕНЬ ТРАНСПОРТА (HTTPS)</text>
  <text x="225" y="235" font-size="10.5" fill="#94A3B8">Шифрование данных при передаче, предотвращение перехвата трафика и MITM-атак</text>
  <text x="225" y="252" font-size="9.5" fill="#64748B" font-style="italic">Ключевые технологии: TLS 1.3, SSL Pinning, Let's Encrypt, OkHttpClient</text>
  <!-- Core Mechanism Box -->
  <rect x="580" y="202" width="220" height="61" rx="8" fill="#090F1E" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="590" y="217" font-size="9.5" font-weight="700" fill="#60A5FA">Транспортное шифрование</text>
  <text x="590" y="232" font-size="9" fill="#94A3B8">· Алгоритм: AES-256-GCM / RSA</text>
  <text x="590" y="247" font-size="9" fill="#94A3B8">· Хэширование подписей: SHA-256</text>
  <!-- Safe Check Status -->
  <circle cx="900" cy="232.5" r="15" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="237" text-anchor="middle" font-size="14" fill="#10B981">✔</text>

  <!-- Connection Line 2 -->
  <line x1="550" y1="275" x2="550" y2="317" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aTeal)"/>


  <!-- ════════════════════════════════════════════════════
       LAYER 2: APPLICATION SECURITY (INPUT VALIDATION)
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="150" y="325" width="800" height="85" rx="14" fill="url(#gTeal)" stroke="#0D9488" stroke-width="1.2"/>
  </g>
  <rect x="150" y="325" width="800" height="4" rx="2" fill="#0D9488" opacity="0.6"/>
  <circle cx="185" cy="367.5" r="18" fill="#064E3B" stroke="#0D9488" stroke-width="1.2"/>
  <text x="185" y="371.5" text-anchor="middle" font-size="12" font-weight="700" fill="#2DD4BF">02</text>
  <text x="225" y="353" font-size="13" font-weight="700" fill="#85F4E4">УРОВЕНЬ ПРИЛОЖЕНИЯ (INPUT VALIDATION)</text>
  <text x="225" y="370" font-size="10.5" fill="#94A3B8">Валидация типов данных и длины строк на клиенте, фильтрация запросов на сервере</text>
  <text x="225" y="387" font-size="9.5" fill="#64748B" font-style="italic">Ключевые технологии: Kotlin Regex, Material3 DatePicker, ValidationException</text>
  <!-- Core Mechanism Box -->
  <rect x="580" y="337" width="220" height="61" rx="8" fill="#051011" stroke="#0D9488" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="590" y="352" font-size="9.5" font-weight="700" fill="#2DD4BF">Валидация параметров</text>
  <text x="590" y="367" font-size="9" fill="#94A3B8">· ИИН: Строго 12 цифр</text>
  <text x="590" y="382" font-size="9" fill="#94A3B8">· Телефон: Формат +77XXXXXXXXX</text>
  <!-- Safe Check Status -->
  <circle cx="900" cy="367.5" r="15" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="372" text-anchor="middle" font-size="14" fill="#10B981">✔</text>

  <!-- Connection Line 3 -->
  <line x1="550" y1="410" x2="550" y2="452" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aPurple)"/>


  <!-- ════════════════════════════════════════════════════
       LAYER 3: AUTHENTICATION SECURITY (JWT / SESSION TOKENS)
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="150" y="460" width="800" height="85" rx="14" fill="url(#gPurple)" stroke="#7C3AED" stroke-width="1.2"/>
  </g>
  <rect x="150" y="460" width="800" height="4" rx="2" fill="#7C3AED" opacity="0.6"/>
  <circle cx="185" cy="502.5" r="18" fill="#4C1D95" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="185" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#A78BFA">03</text>
  <text x="225" y="488" font-size="13" font-weight="700" fill="#DDD6FE">УРОВЕНЬ АУТЕНТИФИКАЦИИ (JWT / ACCESS TOKENS)</text>
  <text x="225" y="505" font-size="10.5" fill="#94A3B8">Идентификация пользователя при помощи токена сессии в заголовке Authorization</text>
  <text x="225" y="522" font-size="9.5" fill="#64748B" font-style="italic">Ключевые технологии: UUID Session Token, UserSessionRepository, AuthInterceptor</text>
  <!-- Core Mechanism Box -->
  <rect x="580" y="472" width="220" height="61" rx="8" fill="#0C071C" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="590" y="487" font-size="9.5" font-weight="700" fill="#A78BFA">Токенизация доступа</text>
  <text x="590" y="502" font-size="9" fill="#94A3B8">· Срок жизни сессии: 168 часов</text>
  <text x="590" y="517" font-size="9" fill="#94A3B8">· Метод передачи: HTTP Bearer Header</text>
  <!-- Safe Check Status -->
  <circle cx="900" cy="502.5" r="15" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="507" text-anchor="middle" font-size="14" fill="#10B981">✔</text>

  <!-- Connection Line 4 -->
  <line x1="550" y1="545" x2="550" y2="587" stroke="#F0ABFC" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aPink)"/>


  <!-- ════════════════════════════════════════════════════
       LAYER 4: AUTHORIZATION SECURITY (RBAC)
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="150" y="595" width="800" height="85" rx="14" fill="url(#gPink)" stroke="#D946EF" stroke-width="1.2"/>
  </g>
  <rect x="150" y="595" width="800" height="4" rx="2" fill="#D946EF" opacity="0.6"/>
  <circle cx="185" cy="637.5" r="18" fill="#701A75" stroke="#D946EF" stroke-width="1.2"/>
  <text x="185" y="641.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F0ABFC">04</text>
  <text x="225" y="623" font-size="13" font-weight="700" fill="#FDF4FF">УРОВЕНЬ АВТОРИЗАЦИИ (ROLE-BASED ACCESS CONTROL)</text>
  <text x="225" y="640" font-size="10.5" fill="#94A3B8">Разграничение доступа к медицинским картам и операциям записи согласно ролям</text>
  <text x="225" y="657" font-size="9.5" fill="#64748B" font-style="italic">Ключевые технологии: Spring Security (Endpoints control), UserSession verification</text>
  <!-- Core Mechanism Box -->
  <rect x="580" y="607" width="220" height="61" rx="8" fill="#13061C" stroke="#D946EF" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="590" y="622" font-size="9.5" font-weight="700" fill="#F0ABFC">Контроль ролей</text>
  <text x="590" y="637" font-size="9" fill="#94A3B8">· Роли: PATIENT (Пациент), DOCTOR</text>
  <text x="590" y="652" font-size="9" fill="#94A3B8">· Ограничение: Только владелец ID</text>
  <!-- Safe Check Status -->
  <circle cx="900" cy="637.5" r="15" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="642" text-anchor="middle" font-size="14" fill="#10B981">✔</text>

  <!-- Connection Line 5 -->
  <line x1="550" y1="680" x2="550" y2="722" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aAmber)"/>


  <!-- ════════════════════════════════════════════════════
       LAYER 5: STORAGE SECURITY (ENCRYPTED PASSWORDS)
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="150" y="730" width="800" height="85" rx="14" fill="url(#gAmber)" stroke="#D97706" stroke-width="1.2"/>
  </g>
  <rect x="150" y="730" width="800" height="4" rx="2" fill="#D97706" opacity="0.6"/>
  <circle cx="185" cy="772.5" r="18" fill="#78350F" stroke="#D97706" stroke-width="1.2"/>
  <text x="185" y="776.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">05</text>
  <text x="225" y="758" font-size="13" font-weight="700" fill="#FEF3C7">УРОВЕНЬ ХРАНЕНИЯ (ENCRYPTED PASSWORDS)</text>
  <text x="225" y="775" font-size="10.5" fill="#94A3B8">Хэширование паролей с криптографической солью перед записью в базу данных</text>
  <text x="225" y="792" font-size="9.5" fill="#64748B" font-style="italic">Ключевые технологии: BCryptPasswordEncoder, Spring Crypto, Secure Database Configuration</text>
  <!-- Core Mechanism Box -->
  <rect x="580" y="742" width="220" height="61" rx="8" fill="#130B04" stroke="#D97706" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="590" y="757" font-size="9.5" font-weight="700" fill="#FBBF24">Безопасность БД</text>
  <text x="590" y="772" font-size="9" fill="#94A3B8">· Алгоритм: BCrypt (Salted Hash)</text>
  <text x="590" y="787" font-size="9" fill="#94A3B8">· Защита: brute-force / rainbow tables</text>
  <!-- Safe Check Status -->
  <circle cx="900" cy="772.5" r="15" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="777" text-anchor="middle" font-size="14" fill="#10B981">✔</text>

  <!-- Connection Line 6 -->
  <line x1="550" y1="815" x2="550" y2="857" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aAmber)"/>


  <!-- ════════════════════════════════════════════════════
       BOTTOM NODE: DATABASE
  ════════════════════════════════════════════════════ -->
  <g filter="url(#sh)">
    <rect x="440" y="865" width="220" height="46" rx="10" fill="#120A05" stroke="#D97706" stroke-width="1.2"/>
  </g>
  <text x="550" y="885" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FBBF24">💾 PostgreSQL Database</text>
  <text x="550" y="899" text-anchor="middle" font-size="9" fill="#78350F">Безопасное изолированное хранение данных</text>


  <!-- ════════════════════════════════════════════════════
       FOOTER & NOTE
  ════════════════════════════════════════════════════ -->
  <line x1="60" y1="930" x2="1040" y2="930" stroke="#1E293B" stroke-width="1"/>
  
  <text x="550" y="952" font-size="9.5" fill="#64748B" text-anchor="middle">
    Безопасность системы IntelliHeart спроектирована на основе принципа Defense in Depth (эшелонированная защита).
  </text>
  <text x="550" y="968" text-anchor="middle" font-size="9" fill="#1E3A5F">Damumed / IntelliHeart Health App · Security Layers Diagram · 2026</text>

</svg>
